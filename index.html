const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw, quiet){
  const msg = document.getElementById('msg');
  if (!quiet) msg.textContent = '解鎖中…';
  try {
    const html = await unlock(pw.trim().toLowerCase());
    try { sessionStorage.setItem('k', pw); } catch(e){}
    document.open(); document.write(html); document.close();
  } catch(e) {
    try { sessionStorage.removeItem('k'); } catch(_){}
    if (!quiet) msg.textContent = (window.crypto && crypto.subtle) ? '密碼不對，請再試一次。' : '這個瀏覽器無法解鎖，請用 Safari 或 Chrome 開啟。';
  }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); go(document.getElementById('pw').value); });
try { const k = sessionStorage.getItem('k'); if (k) go(k, true); } catch(e){}
</script>
